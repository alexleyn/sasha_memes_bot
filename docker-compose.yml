services:
  bot:
    build: .
    image: sasha_memes_bot
    restart: always
    env_file: .env
    volumes:
      - ytdlp_cache:/root/.cache/yt-dlp
      - cookies:/cookies
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ytdlp_cache:
  cookies:
